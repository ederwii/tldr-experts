# schema: draft
# Phase 2 of the loop. Concept §3.
# Design must be placed on REAL files and modules from the code map — not on
# hypothetical components.
name: how
title: How
phase: 2
# `model:` [owner decision, gh #346, 2026-09-16]: sonnet, not opus. Measured
# across three field samples cited on the issue: `how` cost $10.40-$269.90 per
# sample, 11.4-45% of the run's total spend, and its own output went unread
# downstream in roughly half of every sample taken so far. A workspace or a
# single invocation that wants the strong model back overrides
# this the same way every other stage's model is overridden: `.tldrx/stages/how/
# stage.yml` with `model: opus`, or `tldrx next --model opus` / `tldrx run auto
# --model opus` for one invocation (`src/cli/helpText.ts`'s `model()` flag —
# "Everywhere [but --commit --review] the two flags override the stage's
# model:/effort: for every sub-agent of the invocation").
model: sonnet
# `skip_if:` [owner decision, gh #346, 2026-09-16]: when the run's seed already
# declares its own technical solution (an explicit `## Solution` / `## Technical
# approach` H2 — never inferred from prose, `seedSolution.ts`), `how` is
# skipped and `plan` reads that section instead of a `how`-written `design.md`
# (`runNext.ts`'s skip branch materialises `02-how/design.md` from it — the
# ONLY skip_if that does, because it is the only one that leaves a downstream
# stage an input nothing else can produce). No shipped `workflows/*.yml` uses
# the §2.4 record shape yet, so this is the stage's own built-in default
# (`stageSpec.ts`'s `overlay`) rather than a per-scope workflow edit; a
# workflow that declares its own `skip_if` for `how` still wins.
skip_if: "seed_solution==1"
# --effort for this stage's sub-agent (spec §2.3). The cost lever
# `--max-budget-usd` is not: the budget flag only STOPS a turn already in flight.
# `[assumption]` — How is where the thinking is. Every component must land on a
# real path and every contract must survive contact with the code, so this is the
# one stage where effort is bought deliberately rather than saved.
effort: high
# `budget_usd` [assumption]: a scoped guess, never a measurement. No calibration
# corpus exists in this repo, and the one measurement we do have runs the other
# way — a story measured $2.27 against the $0.39 ceiling its spawn was given
# (5.8x). `tldrx cost --stories` is the command that produces the corpus a
# recalibration would need. Changing this number moves the ceiling of every
# workspace that never wrote a `.tldrx/stages/<id>/stage.yml` override.
budget_usd: 6

# `{repo}` expands per repo in the run (spec §2.3, `expandRepos`). It is NOT
# decoration: `tldrx init` writes the map per repo — `.tldrx/map/<repo>/architecture.md`
# — and there has never been a `.tldrx/map/architecture.md` for anything to resolve
# to (`src/core/map/buildMap.ts:74-79`). These two were declared without the token
# until gh #131, and because they are OPTIONAL inputs the miss was silent: How ran
# with no map at all, on every feature-scope run, and nothing said so. 01-what and
# 05-watch carried the token the whole time, which is why it survived.
inputs:
  - "01-what/intent.md"
  - "01-what/scope.md"
  - "01-what/success-metrics.md"
  - ".tldrx/map/{repo}/architecture.md"
  - ".tldrx/map/{repo}/conventions.md"
  - ".tldrx/memory/facts.yml"

outputs:
  - "design.md"
  - "contracts.md"
  - "risks.md"
  - "test-strategy.md"
  - "handoff.md"
  - "questions.md"

# `domain` and `stack` used to be listed here. They were never expert NAMES:
# `stack_experts: true` above already loads `<lang>-stack` for the run's repos,
# and a `kind: domain` expert is picked by the paths this run actually cites
# (spec §2.3, rules 2 and 3). A name nothing can create is a permanent
# "NOT LOADED" line, so the rules are left to do their own work.
experts:
  - architect

# `requires:` used to list three acceptance criteria here. Nothing read them:
# `normaliseGate` (src/core/run/workflowPreset.ts:216-231) reads only `.type`,
# `validateStage` (src/core/schemas/stage.ts:72-76) checks only `gate.type`, and
# no other file in the repo touches the key. Three sentences a reviewer would
# have to open this file to find, that no gate ever enforced, are worse than
# none — the enforcement that IS real is the `checks:` list below.
gate:
  type: human-approval

checks:
  - claim-sources
  - no-reask
  - budget-gate
