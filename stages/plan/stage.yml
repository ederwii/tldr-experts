# schema: draft
# Phase 3 of the loop. Concept §3 and §9.
# Renders into the team's shape: sprints for scrum, a WIP-limited flow board for
# kanban, a plain ordered list for none. Read .tldrx/process.yml, never assume.
name: plan
title: Plan
phase: 3
model: sonnet
# --effort for this stage's sub-agent (spec §2.3). The cost lever
# `--max-budget-usd` is not: the budget flag only STOPS a turn already in flight.
# `[assumption]` — Plan is decomposition against a design that already exists:
# split, order, size, cite. Medium; the hard judgement was made upstream in How.
effort: medium
budget_usd: 4

# `.tldrx/map/workspace.md` carries NO `{repo}` token on purpose, and gh #131's
# sweep left it alone: it is the one map document written at the map ROOT, and
# only in multi-repo mode (`src/core/map/buildMap.ts:83-88`). It is not a
# `MAP_DOCS` document, so `{repo}` would point it at a file that never exists.
# On a SINGLE-repo workspace nothing writes it at all — and since gh #131 that
# absence is named in the prompt and on stdout instead of being performed.
#
# Which left Plan with NO map at all on a single-repo workspace (gh #136), while
# all six `MAP_DOCS` sat unread under `.tldrx/map/<repo>/`. `commands.md` closes
# that, and it is a GATE rather than a preference: Plan writes each story's
# `dod.commands`, the `plan` check validates every one against the workspace
# allowlist and refuses the story when it cannot ("an empty allowlist is not a
# permit", `src/core/schemas/commandAllowlist.ts:33`) — and Plan is shown that
# allowlist nowhere else. `.tldrx/workspace.yml` is not one of its inputs, the
# generic stage prompt renders no commands section (only the DEVELOPER prompt
# does, `src/core/build/prompts.ts:175`), and `workspace.md` carries repo name,
# path, stack, branch and confidence — not commands (`renderWorkspaceMap`).
# `.tldrx/map/<repo>/commands.md` is "the only commands `tldrx` may run in this
# repo (mirror of `workspace.yml`)" (`src/core/map/renderMap.ts:27`).
#
# ONE document, not six. Plan decomposes a design 02-how has already placed on
# real paths, so architecture is upstream work; six per repo on a stage whose job
# is splitting and ordering is the context nobody asked for that the wave-N lesson
# in `seedInputs.ts` is about. Measured: +120 B on a 20,777 B single-repo prompt,
# against budgets of 98,304 (`inputs_max_bytes`) and 163,840 (`prompt_max_bytes`).
inputs:
  - "02-how/design.md"
  - "02-how/contracts.md"
  - "02-how/test-strategy.md"
  - ".tldrx/process.yml"
  - ".tldrx/map/workspace.md"
  - ".tldrx/map/{repo}/commands.md"

outputs:
  - "epics/<epic>.md"
  - "stories/<id>.md"
  - "waves.yml"
  - "budget.yml"
  - "handoff.md"
  - "questions.md"

experts:
  - delivery
  - architect

# `requires:` used to list four acceptance criteria here. Nothing read them:
# `normaliseGate` (src/core/run/workflowPreset.ts:216-231) reads only `.type`,
# `validateStage` (src/core/schemas/stage.ts:72-76) checks only `gate.type`, the
# prompt ships `stage.md` and never this file (src/core/facilitator/prompt.ts:101),
# and no other file in the repo touches the key. Criteria no gate enforces and no
# reader ever sees are worse than none — the enforcement that IS real is the
# `checks:` list below.
gate:
  type: human-approval

checks:
  - claim-sources
  - plan
  - budget-gate
