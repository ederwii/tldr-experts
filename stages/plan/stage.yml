# schema: draft
# Phase 3 of the loop. Concept §3 and §9.
# Renders into the team's shape: sprints for scrum, a WIP-limited flow board for
# kanban, a plain ordered list for none. Read .tldrx/process.yml, never assume.
name: plan
title: Plan
phase: 3
model: sonnet
budget_usd: 4

inputs:
  - "02-how/design.md"
  - "02-how/contracts.md"
  - "02-how/test-strategy.md"
  - ".tldrx/process.yml"
  - ".tldrx/map/workspace.md"

outputs:
  - "epics/<epic>.md"
  - "stories/<id>.md"
  - "waves.yml"
  - "budget.yml"
  - "handoff.md"
  - "questions.md"

experts:
  - delivery
  - architect

gate:
  type: human-approval
  requires:
    - "every story has acceptance criteria, a test plan and the files it touches"
    - "every story carries a repo: field"
    - "a story touching a cross-repo contract has spawned its dependent stories"
    - "waves.yml is dependency-ordered and the total fits budget.yml"

checks:
  - claim-sources
  - plan
  - budget-gate
