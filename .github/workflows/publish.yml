# Trusted publishing (OIDC): no npm token, no OTP. Provenance is attached automatically.
# One-time setup on npmjs.com → package "tldr-experts" → Settings → Trusted Publisher →
# GitHub Actions: owner "ederwii", repository "tldr-experts", workflow "publish.yml".
# Docs: https://docs.npmjs.com/trusted-publishers (npm CLI ≥ 11.5.1, Node ≥ 22.14.0)
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest && npm --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: version must match the tag (on tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version"); TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "package.json $PKG != tag $TAG"; exit 1; }
      - run: npm publish --access public
