name: ci
on:
  push:
    branches: [main]
  pull_request:

# Supersede a run that a newer push on the same ref has already made irrelevant. Measured
# 2026-09-08 over the last week: 25 of 122 push-triggered runs started less than 10 minutes
# apart on a 5.2-minute average run, so an obsolete run kept burning a runner while its
# replacement queued behind it. Safe because this workflow is NOT the release gate — that is
# `scripts/release-check.sh` before the push and `publish.yml` after the tag (docs/RELEASING.md);
# a cancelled `ci` run never stands in for either.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # test/merge-wave.test.ts plants its sandboxes under `tmpdir()` (mkdtempSync,
      # merge-wave.test.ts:104); pointing TMPDIR at a path under `runner.temp` instead of
      # the OS default makes that sandbox nameable so the failure step below can find it
      # (#373, see #237 — every red on the interrupted-merge case so far had no merge.log
      # to diagnose from because nothing captured this directory before the runner tore
      # down). The directory must exist first: mkdtempSync requires its parent to.
      - run: mkdir -p "${{ runner.temp }}/mw"
      - run: bun test
        env:
          TMPDIR: ${{ runner.temp }}/mw
      # Not wrapped in an `if`: this step used to swallow the build's exit code and
      # report "no build script yet", so a red build passed CI. It exists now.
      - run: bun run build
      # Instrument only (#373, see #237): gives a future red on
      # test/merge-wave.test.ts's interrupted-merge case (or its sibling) a merge.log and
      # lock-state to diagnose from, instead of "no merge.log is available from the CI
      # sandbox" every prior #237 data point recorded. Does not touch merge-wave.sh,
      # merge-guard.sh, or merge-wave.test.ts, and does not name #237's mechanism.
      - name: Upload merge-wave sandbox on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merge-wave-sandbox
          path: ${{ runner.temp }}/mw
          retention-days: 14
