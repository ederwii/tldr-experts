name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: build (if the script exists yet)
        run: |
          if bun run --silent build >/dev/null 2>&1; then echo "build ok"; else echo "no build script yet (pre-wave2)"; fi
