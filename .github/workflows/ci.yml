name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Not wrapped in an `if`: this step used to swallow the build's exit code and
      # report "no build script yet", so a red build passed CI. It exists now.
      - run: bun run build
