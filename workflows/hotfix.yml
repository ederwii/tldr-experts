# schema: draft
# A scope is a workflow preset (concept v0.1 addendum). It biases the facilitator:
# which stages run, at what depth, on what budget. Adding a scope = adding one yml.
# The facilitator never hard-codes a scope.
#
# stages  — run in this order; every name must be a folder under stages/
# skips   — stages deliberately NOT run, so the omission is a decision on record
# depth   — minimal | light | standard | deep
name: hotfix
description: "Production is bleeding. Ship, then explain."
stages: [what, build, watch]
skips: [how, plan]
depth: minimal
# `default_budget_usd` [assumption]: a scoped guess for the whole run, never a
# measurement — `planBudget` splits it across the stages this workflow runs. No
# calibration corpus exists in this repo, and the one measurement we do have runs
# the other way — a story measured $2.27 against the $0.39 ceiling its spawn was
# given (5.8x). `tldrx cost --stories` is the command that produces the corpus a
# recalibration would need. Changing this number moves the ceiling of every
# workspace that never wrote a local override.
default_budget_usd: 5
# gates  — who closes each stage's gate: `human` waits for `tldrx approve`,
#           `auto` lets the facilitator close it when ALL SEVEN conditions of
#           `evaluateAutoGate` hold (checks pass, no open question, spend within
#           ceiling, the stage did not fail, claim-sources clean, every story of
#           the plan `done`, and the epic branch touched nothing undeclared).
#           `agent` is the third policy: those same seven, plus no budget decision
#           taken while the stage ran, plus a validated evidence note. Every stage
#           still ENDS at a gate; this only says who signs it. A stage not named
#           here is `human`.
gates: {what: auto, build: human, watch: human}
changes:
  - "What collapses to a ten-line handoff: symptom, blast radius, the one change."
  - "All gates collapse into one human approval."
  - "Retro is MANDATORY at close — this is the scope that skips the most and so owes the most."
