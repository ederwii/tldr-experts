# schema: draft
# Written by `tldrx init` to .tldrx/workspace.yml. Concept §4.1 and the v0.1
# workspace-model addendum.
#
# mode: single  — cwd is itself a git repo
# mode: multi   — cwd contains child dirs that are git repos; those are the repos.
#                 One .tldrx/ at the root, always. Shared: memory/, experts/,
#                 stages/, workflows/. Per repo: map/<repo>/, conventions/<repo>.md.
version: 1
mode: single
root: "."
detected_at: null

repos:
  - name: example
    path: "."
    languages: []
    frameworks: []
    # Commands are DISCOVERED, never assumed. An empty value means "not found",
    # which is different from "there is none" — say which in the handoff.
    commands:
      # The repo's own installer. tldrx runs it in every FRESH Build story
      # worktree, before the developer, and records it as its own check with an
      # exit code and a duration. A story worktree is a fresh checkout of tracked
      # files — no node_modules, no virtualenv, no restored packages, and none of
      # this checkout's — so a `test:` that needs them exits 127 without it.
      # Left empty, tldrx installs nothing and guesses nothing (gh #209).
      install: ""
      build: ""
      test: ""
      lint: ""
      typecheck: ""
      # Optional, and never detected — write it yourself or leave it out. The fast
      # subset the Build developer iterates on while working. It is NOT a Definition
      # of Done command and a story's ```dod block that names it is refused: `test:`
      # above is what proves the story, and the gate re-runs that after the developer
      # stops.
      # test_fast: ""

# Cached from `claude mcp list` at init (it runs live health checks and is slow).
# .mcp.json is the fast path; this is the verified one.
mcp_servers: []
