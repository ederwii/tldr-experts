# schema: draft
# Written to tldrx-work/<run>/budget.yml. Concept §11.
#
# ceiling_usd is a refusal, not a warning: a stage whose estimate exceeds what
# remains does not start. spent_usd is rolled up from events.jsonl — never typed
# by hand, never estimated by an agent.
#
# `economy:` is optional and says what these numbers are DENOMINATED IN:
#   metered-usd  (the default) dollars a spawn may spend
#   host-tokens  a host-session token allowance — not money, never a spawn cap
# Leave it out and everything behaves as it always has. See spec §2.11.
#
# A stage's `budget_usd` is what ONE attempt costs. A PHASE ceiling holds every
# attempt its stages may take — `attempts` (a stage key, default 2) x the stage
# share — so a stage that fails once can be retried without raising money for
# work already paid for (gh #170). That is why the phase figures below are twice
# the stage budgets `stages/<id>/stage.yml` declares, and why `ceiling_usd` is
# their sum rather than the sum of the stage budgets.
version: 1
run: "260828-example-slug"
ceiling_usd: 50
spent_usd: 0

per_phase_usd:
  what: 8
  how: 12
  plan: 8
  build: 18
  watch: 4
