# schema: draft
#
# The local dev environment manifest. `tldrx doctor` reads this file, runs each
# `check` command, and prints what it found.
#
# The framework NEVER installs anything. `install` holds a copy-paste hint per OS
# and nothing more. Keys: macos | linux | windows | all.
#
# `check` must exit 0 when the tool is usable and print something version-shaped
# (the first dotted numeric run in stdout+stderr is taken as the version).

version: 1

tools:
  - id: bun
    # Optional, and the reason is measured (2026-09-02): `node dist/tldrx.js --version` prints
    # the version and exits 0 with no Bun involved. `src/core/runtime/index.ts` selects its
    # implementation off `typeof Bun` at import time, and `nodeRuntime.ts` is complete — the
    # `yaml` package it leans on is inlined by `bun build --target=node`, so a published
    # install resolves zero runtime dependencies. Marking Bun REQUIRED here made `tldrx doctor`
    # exit 1 on a machine where tldrx was installed and working, because `DoctorReport.healthy`
    # is "no required tool is missing". Bun builds the bundle; it does not run it.
    required: false
    min_version: "1.3.0"
    check: "bun --version"
    purpose: "Builds the published bundle (`bun run build`) and runs the test suite; also runs the hooks straight from a clone (plugin/hooks/hooks.json spawns `bun`). NOT needed to run an installed tldrx — that is a Node bundle. Bun 1.3+ is for native Bun.YAML."
    install:
      macos: "curl -fsSL https://bun.sh/install | bash"
      linux: "curl -fsSL https://bun.sh/install | bash"
      windows: "powershell -c \"irm bun.sh/install.ps1 | iex\"   (or: npm install -g bun)"

  - id: node
    required: true
    min_version: "20.0.0"
    check: "node --version"
    purpose: "Runs the published build (package.json bin + engines). Also required by Claude Code itself."
    install:
      macos: "brew install node   (or: https://nodejs.org)"
      linux: "https://nodejs.org/en/download/package-manager"
      windows: "winget install OpenJS.NodeJS   (or: https://nodejs.org)"

  - id: git
    required: true
    min_version: "2.30.0"
    check: "git --version"
    purpose: "Workspace detection, worktrees for parallel stories, churn data for map/hotspots.md."
    install:
      macos: "xcode-select --install   (or: brew install git)"
      linux: "sudo apt-get install git   (or your distro's package manager)"
      windows: "winget install Git.Git"

  - id: claude
    required: true
    min_version: "2.0.0"
    check: "claude --version"
    purpose: "The pilot harness: hooks, the statusline, and `doctor --mcp` are Claude Code primitives. It is also the default automated runner (`claude -p --output-format stream-json`); Codex can replace that runner only."
    install:
      all: "npm install -g @anthropic-ai/claude-code   (see https://code.claude.com/docs/en/quickstart)"

  - id: codex
    required: false
    min_version: "0.152.0"
    check: "codex --version"
    purpose: "Optional automated runner selected with TLDRX_AGENT_PROVIDER=codex."
    install:
      all: "npm install -g @openai/codex   (see https://developers.openai.com/codex/cli)"

  - id: python3
    required: false
    min_version: "3.10.0"
    check: "python3 --version"
    purpose: "Runtime for graphify (the code-map tool). Only needed if you want `tldrx map`."
    install:
      macos: "brew install python@3.12   (or: https://www.python.org/downloads)"
      linux: "sudo apt-get install python3 python3-pip"
      windows: "winget install Python.Python.3.12"

  - id: graphify
    required: false
    min_version: "0.8.0"
    check: "graphify --version"
    purpose: "Deterministic tree-sitter code map. Feeds map/*.md. Absent = `tldrx map` cannot run; nothing else is affected."
    install:
      all: "pip install graphify   (requires python3 >= 3.10)"

  - id: gh
    required: false
    min_version: "2.0.0"
    check: "gh --version"
    purpose: "Optional ticket adapter (GitHub issues) and PR operations."
    install:
      macos: "brew install gh"
      linux: "https://github.com/cli/cli/blob/trunk/docs/install_linux.md"
      windows: "winget install GitHub.cli"
